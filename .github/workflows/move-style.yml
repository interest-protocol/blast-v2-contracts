name: Move style

on:
  push:
    paths: ['sui/**', 'scratch-sui/**', 'scripts/**', 'AGENTS.md', '.github/workflows/move-style.yml']
  pull_request:
    paths: ['sui/**', 'scratch-sui/**', 'scripts/**', 'AGENTS.md', '.github/workflows/move-style.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: python3 scripts/check_move_style.py
