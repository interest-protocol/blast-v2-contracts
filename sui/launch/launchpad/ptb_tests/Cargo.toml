[package]
name = "blast-launchpad-ptb-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.71"
base64 = "0.21.2"
bcs = "0.1.4"
blake2 = "0.10.6"
rand = "0.8.5"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = { version = "1.0.95", features = ["preserve_order"] }
move-binary-format = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548" }
move-core-types = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548" }
simulacrum = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548" }
sui-swarm-config = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548" }
sui-types = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548" }

move-coverage = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548", optional = true }
move-trace-format = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548", optional = true }
prometheus = { version = "0.14", optional = true }
sui-config = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548", optional = true }
sui-execution = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548", optional = true, features = ["tracing"] }
sui-transaction-checks = { git = "https://github.com/MystenLabs/sui.git", rev = "51d177ad7d65102fc368b582408f466d97b31548", optional = true }

[features]
fork-coverage = ["dep:move-coverage", "dep:move-trace-format", "dep:prometheus", "dep:sui-config", "dep:sui-execution", "dep:sui-transaction-checks"]

[profile.dev]
debug = 0

[[bin]]
name = "merge-fork-coverage"
path = "src/bin/merge_fork_coverage.rs"
required-features = ["fork-coverage"]
